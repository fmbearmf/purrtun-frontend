server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache Nuxt build assets aggressively
  location /_nuxt/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}

